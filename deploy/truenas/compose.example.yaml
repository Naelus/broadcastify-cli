name: radio-archive-intelligence

services:
  web:
    image: radio-archive-intelligence:SOURCE_COMMIT
    pull_policy: never
    restart: unless-stopped
    init: true
    user: "APP_UID:APP_GID"
    group_add:
      - "RENDER_GID"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    # Host networking is intentional: Docker's normal port-publishing boundary
    # does not deliver LAN broadcast/multicast discovery packets to the app.
    # The HTTP server still binds only the selected private TrueNAS address.
    network_mode: host
    command:
      - --host
      - TRUENAS_LAN_IP
      - --port
      - "8765"
      - --working-dir
      - /data
      - --output-dir
      - /data/archives
      - --database
      - /data/archives/broadcastify-analysis.sqlite3
    environment:
      HOME: /data/runtime/home
      XDG_CACHE_HOME: /data/runtime/cache
      HF_HOME: /data/models/huggingface
      LLAMA_CACHE: /data/models/llama-cache
      BROADCASTIFY_RUNTIME_DIR: /data/runtime
      BROADCASTIFY_MODEL_DIR: /data/models
      FFMPEG_PATH: /usr/bin/ffmpeg
      WHISPER_CPP_PATH: /app/build/bin/whisper-cli
      WHISPER_CPP_MODEL_PATH: /data/models/whisper.cpp/ggml-base.en-q5_1.bin
      WHISPER_CPP_VAD_MODEL_PATH: /data/models/whisper.cpp/ggml-silero-v6.2.0.bin
      BROADCASTIFY_DEFAULT_HARDWARE_PROFILE: vulkan
      BROADCASTIFY_DEFAULT_WHISPER_MODEL: base.en
      BROADCASTIFY_DEFAULT_ASR_ENGINE: whisper.cpp
      BROADCASTIFY_DEFAULT_DEVICE: vulkan
      BROADCASTIFY_DEFAULT_DIARIZATION_ENGINE: sherpa-onnx
      BROADCASTIFY_DEFAULT_DIARIZATION_DEVICE: cpu
      BROADCASTIFY_DEFAULT_BATCH_SIZE: "8"
      BROADCASTIFY_LAN_SHARING: "true"
      BROADCASTIFY_LAN_DISCOVERY_ENABLED: "true"
      BROADCASTIFY_LAN_ADVERTISE_URL: "http://TRUENAS_LAN_IP:8765"
      LLAMA_SERVER_PATH: /app/llama-server
      ANALYSIS_PROVIDER: local
      ANALYSIS_MODEL: /data/models/llama/gemma-3-1b-it-q4_k_m.gguf
    volumes:
      - TRUENAS_DATASET_PATH:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=2g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 2048
    stop_grace_period: 30s
