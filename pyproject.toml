[build-system]
requires = ["setuptools>=46.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "broadcastify-cli"
version = "0.4.71"
description = "Evidence-first local radio archive intelligence application"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "NotJoeMartinez", email = "notjoemartinez@protonmail.com" },
    { name = "Banderick"}
]
keywords = ["radio", "broadcastify", "transcription", "diarization", "local-ai"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]


dependencies = [
    "beautifulsoup4>=4.12,<5",
    "click>=8.1,<9",
    "cryptography>=45,<47",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "rich>=13.7,<15",
    "tzdata>=2026.3,<2027; platform_system == 'Windows'"
]

[project.optional-dependencies]
transcription = [
    "faster-whisper>=1.2,<2",
    "pyannote.audio>=4.0,<5",
    "torch>=2.8,<3",
    "torchaudio>=2.8,<3"
]
analysis = [
    "fastembed>=0.8,<1"
]
openvino = [
    "huggingface-hub>=0.27,<2",
    "numpy>=1.26,<2.5",
    "openvino>=2026.1,<2027",
    "openvino-genai>=2026.1,<2027"
]
windowsml = [
    "huggingface-hub>=0.34,<1; platform_system == 'Windows'",
    "onnx>=1.19,<2; platform_system == 'Windows'",
    "onnx-ir>=0.2,<1; platform_system == 'Windows'",
    "onnxruntime-genai>=0.14,<0.15; platform_system == 'Windows'",
    "transformers>=4.57,<5; platform_system == 'Windows'"
]
qwen = [
    "numpy>=1.26,<3",
    "sherpa-onnx>=1.13.4,<2"
]
portable-diarization = [
    "numpy>=1.26,<3",
    "sherpa-onnx>=1.13.4,<2"
]
dev = [
    "pytest>=8,<10"
]

[project.scripts]
broadcastify-cli = "broadcastify_cli.broadcastify_cli:cli"
broadcastify-analysis = "broadcastify_cli.analysis_cli:cli"
broadcastify-web = "broadcastify_cli.web_app:main"
radio-archive-lan-node = "broadcastify_cli.lan_node:main"
radio-archive-service = "broadcastify_cli.linux_service:main"

[project.urls]
Homepage = "https://github.com/Naelus/broadcastify-cli"
Repository = "https://github.com/Naelus/broadcastify-cli"
Issues = "https://github.com/Naelus/broadcastify-cli/issues"

[tool.setuptools.packages.find]
include = ["broadcastify_cli*"]
exclude = ["archives*", "tests*", "BroadcastifyCli*"]
namespaces = false

[tool.setuptools.package-data]
broadcastify_cli = ["web_static/*"]
