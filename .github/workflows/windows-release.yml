name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (defaults to pyproject.toml)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Install offline regression dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          .\scripts\install_inno_setup.ps1

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $requested = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($requested) -and "${{ github.ref_type }}" -eq "tag") {
            $requested = "${{ github.ref_name }}".TrimStart("v")
          }
          if ([string]::IsNullOrWhiteSpace($requested)) {
            $text = Get-Content .\pyproject.toml -Raw
            $requested = [regex]::Match(
              $text,
              '(?ms)^\[project\].*?^version\s*=\s*"(?<version>\d+\.\d+\.\d+(?:\.\d+)?)"'
            ).Groups["version"].Value
          }
          "value=$requested" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          .\scripts\build_windows_installer.ps1 `
            -Version "${{ steps.version.outputs.value }}" `
            -BuildPython (Get-Command python.exe).Source

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BroadcastifyDesktop-${{ steps.version.outputs.value }}-win-x64
          path: dist/windows/BroadcastifyDesktop-${{ steps.version.outputs.value }}-win-x64-setup.exe
          if-no-files-found: error

      - name: Publish tagged release asset
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "dist/windows/BroadcastifyDesktop-${{ steps.version.outputs.value }}-win-x64-setup.exe"
          if (gh release view "${{ github.ref_name }}" *> $null) {
            gh release upload "${{ github.ref_name }}" $asset --clobber
          } else {
            gh release create "${{ github.ref_name }}" $asset `
              --title "Broadcastify Desktop ${{ steps.version.outputs.value }}" `
              --generate-notes
          }
