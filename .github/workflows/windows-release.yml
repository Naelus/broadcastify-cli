name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (defaults to pyproject.toml)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Install offline regression dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          .\scripts\install_inno_setup.ps1

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $requested = $env:REQUESTED_VERSION
          $tagVersion = ""
          if ($env:REF_TYPE -eq "tag") {
            if ($env:REF_NAME -notmatch '\Av\d+\.\d+\.\d+(?:\.\d+)?\z') {
              throw "Release tags must be v<major>.<minor>.<patch>[.<revision>]."
            }
            $tagVersion = $env:REF_NAME.Substring(1)
            if ([string]::IsNullOrWhiteSpace($requested)) {
              $requested = $tagVersion
            }
          }
          if ([string]::IsNullOrWhiteSpace($requested)) {
            $text = Get-Content .\pyproject.toml -Raw
            $requested = [regex]::Match(
              $text,
              '(?ms)^\[project\].*?^version\s*=\s*"(?<version>\d+\.\d+\.\d+(?:\.\d+)?)"'
            ).Groups["version"].Value
          }
          if ($requested -notmatch '\A\d+\.\d+\.\d+(?:\.\d+)?\z') {
            throw "Release version must contain exactly three or four numeric components."
          }
          if ($env:REF_TYPE -eq "tag" -and $requested -ne $tagVersion) {
            throw "The requested version must match the pushed release tag."
          }
          "value=$requested" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          .\scripts\build_windows_installer.ps1 `
            -Version $env:RELEASE_VERSION `
            -BuildPython (Get-Command python.exe).Source

      - name: Exercise installer lifecycle
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ github.workspace }}\dist\windows\BroadcastifyDesktop-${{ steps.version.outputs.value }}-win-x64-setup.exe
        run: |
          .\scripts\run_windows_installer_lifecycle.ps1 `
            -Installer $env:INSTALLER_PATH

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BroadcastifyDesktop-${{ steps.version.outputs.value }}-win-x64
          path: dist/windows/BroadcastifyDesktop-${{ steps.version.outputs.value }}-win-x64-setup.exe
          if-no-files-found: error

      - name: Publish tagged release asset
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $asset = "dist/windows/BroadcastifyDesktop-${env:RELEASE_VERSION}-win-x64-setup.exe"
          if (gh release view $env:RELEASE_TAG *> $null) {
            gh release upload $env:RELEASE_TAG $asset --clobber
          } else {
            gh release create $env:RELEASE_TAG $asset `
              --title "Broadcastify Desktop $env:RELEASE_VERSION" `
              --generate-notes
          }
