name: TrueNAS container release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Committed tag, branch, or 40-character commit to package
        required: true
        default: main
        type: string

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      image: ${{ steps.release.outputs.image }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out committed source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Resolve immutable release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          test "${#commit}" -eq 40
          test -z "$(git status --porcelain --untracked-files=no)"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/radio-archive-intelligence"
          tag="${version}-${commit:0:7}"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Install offline regression dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run full offline regression suite
        run: python -m pytest -q

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.commit }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish the verified TrueNAS image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/truenas/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SOURCE_COMMIT=${{ needs.verify.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.commit }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
          tags: |
            ${{ needs.verify.outputs.image }}:${{ needs.verify.outputs.tag }}
            ${{ needs.verify.outputs.image }}:${{ needs.verify.outputs.version }}
          cache-from: type=gha,scope=truenas-amd64
          cache-to: type=gha,mode=max,scope=truenas-amd64

      - name: Record immutable image reference
        run: |
          printf 'Published `%s:%s` from `%s`.\n' \
            '${{ needs.verify.outputs.image }}' \
            '${{ needs.verify.outputs.tag }}' \
            '${{ needs.verify.outputs.commit }}' >> "$GITHUB_STEP_SUMMARY"
